<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5efe3" />
    <meta name="description" content="NeighborAid connects people who could use a hand with volunteers on their own streets: errands, lifts, repairs and community projects." />
    <link rel="canonical" href="%REACT_APP_SITE_URL%/" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Social previews (Open Graph and Twitter/X) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NeighborAid" />
    <meta property="og:title" content="NeighborAid: help from the people next door" />
    <meta property="og:description" content="Ask a neighbor for a hand, or lend one. Errands, lifts, small repairs and community projects, arranged in a few taps." />
    <meta property="og:url" content="%REACT_APP_SITE_URL%/" />
    <meta property="og:image" content="%REACT_APP_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hand-drawn street of houses with two neighbors helping each other, and the words Help is closer than you think." />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NeighborAid: help from the people next door" />
    <meta name="twitter:description" content="Ask a neighbor for a hand, or lend one. Errands, lifts, small repairs and community projects." />
    <meta name="twitter:image" content="%REACT_APP_SITE_URL%/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "NeighborAid",
        "url": "%REACT_APP_SITE_URL%/",
        "description": "A community help platform connecting people who need a hand with volunteers in their neighborhood."
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Caveat:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before React loads so there is no flash of the wrong edition.
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "light" && t !== "dark") t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    <title>NeighborAid · Help from the people next door</title>
  </head>
  <body>
    <noscript>NeighborAid needs JavaScript to run. Please enable it and reload the page.</noscript>
    <div id="root"></div>
  </body>
</html>
