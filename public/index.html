<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f6f8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="NeighborAid connects residents who need a hand with volunteers on their street. Errands, rides, repairs and community projects." />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      // Resolve the theme before first paint so there is no flash of the wrong one.
      (function () {
        var t = "light";
        try {
          var saved = localStorage.getItem("na.theme");
          t = saved === "light" || saved === "dark" ? saved : window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        } catch (e) {}
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <title>NeighborAid · Help from people next door</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run NeighborAid.</noscript>
    <div id="root"></div>
  </body>
</html>
