# NeighborAid backend configuration.
#
# Every value can be overridden with an environment variable (names in ${...}).
# The defaults below are for LOCAL DEVELOPMENT ONLY. Production uses the "prod" profile
# (SPRING_PROFILES_ACTIVE=prod), which has no defaults for credentials. See DEPLOYMENT_GUIDE.md.

spring.application.name=NeighborAid
server.port=${PORT:8080}

# --- Database ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/neigboraid?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
# Local development default only. Never use this password for a shared or production database.
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=true
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# --- Session cookie ---
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=${SESSION_TIMEOUT:60m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# --- CORS: comma-separated frontend origins allowed to call the API with cookies ---
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# --- Errors: never send stack traces or exception details to clients ---
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# --- Health check for uptime monitoring: GET /actuator/health ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
