# Production profile: activate with SPRING_PROFILES_ACTIVE=prod.
# Credentials have NO defaults here: the app refuses to start until they are provided.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Schema changes should be applied deliberately (see DEPLOYMENT_GUIDE.md), not on every boot.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false

# HTTPS only: the session cookie is never sent over plain HTTP.
server.servlet.session.cookie.secure=true

# Trust X-Forwarded-* headers from the reverse proxy / load balancer (real client IP for
# rate limiting, correct https detection for the Secure cookie and HSTS).
server.forward-headers-strategy=native

app.cors.allowed-origins=${CORS_ORIGINS}

logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
