# Tests never touch the development database. Override with TEST_DB_URL / DB_USERNAME / DB_PASSWORD in CI.
spring.application.name=NeighborAid
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3307/neigboraid_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
app.cors.allowed-origins=http://localhost:3000
management.endpoints.web.exposure.include=health
